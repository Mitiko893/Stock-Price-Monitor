name: Daily Stock Report

on:
  schedule:
    # 毎時00分に自動更新(UTC)
    #日本時間では毎時+9時間
    - cron: '0 0~14 * * 1-5'
  workflow_dispatch:
    # GitHubの画面から手動実行もできるようにする

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 必要なライブラリをインストール
        run: pip install yfinance feedparser tabulate requests

      - name: レポートを生成（AI要約はクラウド上では使えないため --no-ai）
        run: python main.py --no-ai --html docs/index.html

      - name: 変更をコミットしてpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "レポートを自動更新"
          git push
